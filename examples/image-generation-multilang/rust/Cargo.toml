[package]
name = "airouter-image-demo"
version = "0.1.0"
edition = "2021"
description = "Production-shaped text-to-image and image-to-image example for AI-ROUTER"
license = "MIT"
readme = "README.md"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["fs", "macros", "rt-multi-thread"] }
