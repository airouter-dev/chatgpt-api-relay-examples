[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-router-image-demo"
version = "0.1.0"
description = "A dependency-free text-to-image and image-to-image demo for OpenAI-compatible APIs"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "AI-ROUTER" }]
dependencies = []

[project.scripts]
image-demo = "image_demo.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["image_demo*"]
