name: x402 examples

on:
  push:
    paths:
      - 'examples/x402/**'
      - '.github/workflows/x402-examples.yml'
  pull_request:
    paths:
      - 'examples/x402/**'
      - '.github/workflows/x402-examples.yml'

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/x402/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go test ./...
      - run: go vet ./...

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/x402/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m ruff check src tests

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/x402/nodejs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: examples/x402/nodejs/package-lock.json
      - run: npm install
      - run: npm test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check example docs and secret hygiene
        shell: bash
        run: |
          test -f examples/x402/.env.example
          test -f examples/x402/config.example.toml
          ! grep -RInE 'sk-[A-Za-z0-9]{20,}|0x[0-9a-fA-F]{64}' examples/x402 --exclude='*.lock'
          python -m json.tool examples/x402/model-endpoints.json >/dev/null
